[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolutiontree"
version = "0.2"
description = "Systematic exploration of clustering resolutions in single-cell analysis"
readme = "README.md"
requires-python = ">=3.9"

license = {text = "MIT"}

authors = [
    {name = "Joe Hou", email = "joseph.houjue@gmail.com"},
]

keywords = [
    "single-cell",
    "clustering",
    "resolution",
    "scanpy",
    "leiden",
    "visualization"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scanpy>=1.9.8",
    "anndata>=0.10",
    "igraph>=0.11",
    "networkx>=3.2",
    "leidenalg>=0.10",
    "umap-learn>=0.5.5",
    "spatialdata",
    "spatialdata[extra]"
]

[project.urls]
Homepage = "https://github.com/joe-jhou2/resolutiontree"
Repository = "https://github.com/joe-jhou2/resolutiontree"
"Bug Tracker" = "https://github.com/joe-jhou2/resolutiontree/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["resolutiontree*"]

[tool.setuptools.package-dir]
"" = "src"